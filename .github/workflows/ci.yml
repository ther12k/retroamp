name: Linux tests

on:
  push:
    branches: [main, experiment/gpui]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.89.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Install native build prerequisites
        run: |
          # The runner's Microsoft repo intermittently 403s; our packages come
          # from the Ubuntu archive, so a partial update is fine.
          sudo apt-get update || echo "apt-get update had failures; continuing"
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libasound2-dev

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Run locked tests
        run: cargo test --locked

  gpui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.89.0
      # No cache and no need for debug info: keep the ~590-package tree lean.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Install native build prerequisites
        run: |
          # See the note in the `test` job about the Microsoft repo 403s.
          sudo apt-get update || echo "apt-get update had failures; continuing"
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libasound2-dev libfontconfig1-dev

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Run locked tests for the GPUI frontend
        run: cargo test --locked --no-default-features --features gpui-ui

      - name: Build the GPUI binary
        run: cargo build --locked --no-default-features --features gpui-ui --bin retroamp-gpui
