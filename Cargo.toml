[package]
name = "retroamp"
version = "0.1.0"
edition = "2024"
authors = ["RetroAmp Linux Contributors"]
description = "RetroAmp: modular retro multimedia player for Linux in Rust"
default-run = "retroamp"

[features]
default = ["egui-ui"]
egui-ui = ["dep:eframe", "dep:egui", "dep:image", "dep:zip", "dep:rfd", "dep:fastrand"]
# gpui 0.2.2 pulls xattr 0.2.3, which reads `libc::ENOATTR`; libc dropped that constant
# on Linux in 0.2.190. Pinning libc in the manifest keeps `cargo update` from lifting it.
# The resolver then has to hold mio at <= 1.2.4, which still accepts libc 0.2.189.
gpui-ui = ["dep:gpui", "dep:libc"]

[[bin]]
name = "retroamp"
path = "src/main.rs"
required-features = ["egui-ui"]

[[bin]]
name = "retroamp-gpui"
path = "src/bin/retroamp-gpui.rs"
required-features = ["gpui-ui"]

[[test]]
name = "ui_geometry"
path = "tests/ui_geometry.rs"
required-features = ["egui-ui"]

[dependencies]
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = { version = "0.31", optional = true }
gpui = { version = "=0.2.2", optional = true }
libc = { version = "=0.2.189", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "bmp"] }
zip = { version = "2.2", optional = true, default-features = false, features = ["deflate"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-flac", "symphonia-wav", "symphonia-vorbis", "symphonia-aac"] }
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6.4"
rfd = { version = "0.15", optional = true }
crossbeam-channel = "0.5"
parking_lot = "0.12"
fastrand = { version = "2.3", optional = true }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
